services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Live reload for python code

  frontend:
    build: ./frontend
    ports:
      - "5173:5173" # Map host port 5173 to container port 5173 (Vite default)
    volumes:
      - ./frontend:/app # Live reload for React code
      - /app/node_modules # Prevent overwriting node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend